[platformio]
default_envs = nanoatmega328

[env]
platform = atmelavr@5.2.0
framework = arduino
monitor_speed = 9600
lib_deps =
    chris--a/Keypad@3.1.1
    fastled/FastLED@3.10.3

[env:nanoatmega328]
board = nanoatmega328
upload_protocol = arduino
upload_speed = 57600

[env:uno]
board = uno
; Uno ports are auto-detected. Override locally or pass --upload-port.
